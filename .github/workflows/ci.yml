name: CI

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    android-apk:
        name: Type check and build Android APK
        runs-on: ubuntu-latest
        timeout-minutes: 60
        env:
            CI: 'true'

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22.23.2

            - name: Install dependencies
              run: corepack pnpm install --frozen-lockfile

            - name: Run TypeScript type check
              run: corepack pnpm run typecheck

            - name: Generate Android project
              run: corepack pnpm exec expo prebuild --platform android --no-install

            - name: Set up JDK 17
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: '17'
                  cache: gradle

            - name: Set up Android SDK
              uses: android-actions/setup-android@v4
              with:
                  packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006

            - name: Build installable test APK
              working-directory: android
              run: ./gradlew :app:assembleRelease --no-daemon

            - name: Upload APK
              uses: actions/upload-artifact@v7
              with:
                  name: new-bili-test-apk
                  path: android/app/build/outputs/apk/release/app-release.apk
                  if-no-files-found: error
                  compression-level: 0
                  retention-days: 14
